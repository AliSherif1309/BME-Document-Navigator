name: Build portable applications
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -v
      - run: python build_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: BME-Navigator-${{ matrix.os }}
          path: dist/BME-Navigator/
          if-no-files-found: error
